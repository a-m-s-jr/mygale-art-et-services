name: Promote to Super Admin (one-time bootstrap)

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email of the existing ADMIN account to promote to SUPER_ADMIN'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PROMOTE_EMAIL: ${{ github.event.inputs.email }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Promote account
        run: pnpm --filter @mygale/prisma exec tsx prisma/promote-super-admin.ts
